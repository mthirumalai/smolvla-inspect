# ============================================================================
# Dataset Augmentation Configuration
# ============================================================================
# Controls which augmentations are applied to training data and their params.
# All augmentations are independently toggleable via `enabled: true/false`.
#
# PIXEL VALUES: Images are float32 in [0.0, 1.0] range internally.
#   0.0 = black, 0.5 = mid-gray, 1.0 = white.
#
# Usage:
#   python scripts/augment_dataset.py \
#     --dataset mthirumalai/so101.pnp.1 \
#     --config configs/augmentation.yaml \
#     --output-repo my-org/so101.pnp.1.augmented
# ============================================================================

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
seed: 42                    # any integer; controls all random augmentation choices
num_copies: 3               # 1-N; how many augmented versions of each episode to create
device: auto                # "auto", "cpu", "cuda", or "mps" (for SAM segmentation)
                            #   auto = cuda if available, then mps (macOS), then cpu
seg_every_n: 1              # [1-N] — re-run SAM segmentation every N frames
                            #   1 = every frame (accurate, slow)
                            #   10 = every 10th frame (good balance)
                            #   9999 = once per episode (fast, but mask drifts as robot moves)
task_string: null           # override task string (null = read from dataset)
episodes: null              # list of episode indices to augment (null = all)
use_videos: true            # encode output as video (recommended)
image_writer_threads: 4     # 0 = synchronous; 1-8 = parallel image writing threads

# ---------------------------------------------------------------------------
# Background replacement
# ---------------------------------------------------------------------------
# Replaces background pixels with a synthetic fill.
# Requires SAM segmentation unless --skip-segmentation (then applies to full image).
background_replacement:
  enabled: true
  strategy: mix             # "gray" | "noise" | "blur" | "image_bank" | "mix"
  # Mix mode: randomly pick a strategy per frame based on weights.
  # Only used when strategy is "mix". Each entry needs a strategy name
  # and a weight (higher = more likely). Weights are normalized automatically.
  mix:
    - strategy: noise
      weight: 0.25
    - strategy: blur
      weight: 0.25
    - strategy: gray
      weight: 0.2
    - strategy: image_bank
      weight: 0.3
  # Per-strategy parameters (used by both single-strategy and mix mode):
  gray:
    value: 0.5              # [0.0, 1.0] — constant fill intensity (0=black, 1=white)
  noise:
    # Uniform random noise per pixel; seeded from global seed + copy index
    low: 0.0                # [0.0, 1.0] — noise lower bound
    high: 1.0               # [0.0, 1.0] — noise upper bound (must be >= low)
  blur:
    sigma: 20.0             # [1.0, 50.0] — Gaussian blur sigma in pixels
                            #   small (5): slight softening
                            #   medium (20): background mostly unrecognizable
                            #   large (40+): fully smoothed out
  image_bank:
    directory: ./backgrounds  # path to folder of background images (jpg/png)
    resize_mode: crop        # "crop" (random crop to match aspect) or "resize" (stretch)

# ---------------------------------------------------------------------------
# Color jitter
# ---------------------------------------------------------------------------
# Randomly adjusts brightness, contrast, saturation, and hue.
# Each parameter sets the MAX random deviation from the original.
# The actual jitter is sampled uniformly from [-value, +value] per frame.
color_jitter:
  enabled: true
  target: full              # "foreground" | "background" | "full"
  brightness: 0.4           # [0.0, 1.0] — max brightness shift
                            #   0.0 = no change, 0.2 = subtle, 0.5 = strong, 1.0 = extreme
  contrast: 0.4             # [0.0, 1.0] — max contrast multiplier deviation from 1.0
                            #   actual multiplier sampled from [1-val, 1+val]
                            #   0.0 = no change, 0.3 = moderate, 0.5 = strong
  saturation: 0.3           # [0.0, 1.0] — max saturation multiplier deviation from 1.0
                            #   actual multiplier sampled from [1-val, 1+val]
                            #   0.0 = no change, 0.3 = moderate, 1.0 = can fully desaturate
  hue: 0.1                  # [0.0, 0.5] — max hue rotation (fraction of color wheel)
                            #   0.0 = no change, 0.1 = slight shift, 0.5 = any color possible

# ---------------------------------------------------------------------------
# Gaussian blur (soft augmentation applied to full image)
# ---------------------------------------------------------------------------
gaussian_blur:
  enabled: false
  probability: 0.5          # [0.0, 1.0] — chance of applying per frame (0=never, 1=always)
  kernel_size_range: [5, 15]  # [odd integers, min 3] — randomly sampled blur kernel size
  sigma_range: [0.5, 2.0]    # [>0] — randomly sampled sigma in pixels
                              #   0.5 = barely visible, 1.0 = soft, 2.0+ = noticeably blurry

# ---------------------------------------------------------------------------
# Random crop + resize (breaks spatial priors)
# ---------------------------------------------------------------------------
random_crop:
  enabled: false
  scale_range: [0.8, 1.0]   # [0.0, 1.0] — fraction of original image area to keep
                             #   0.8 = crop up to 20% of area, 0.5 = crop up to half
  ratio_range: [0.9, 1.1]   # [>0] — aspect ratio jitter (width/height)
                             #   1.0 = original ratio, 0.9-1.1 = slight stretch/squeeze

# ---------------------------------------------------------------------------
# Foreground cutout / occlusion (forces robustness to partial visibility)
# ---------------------------------------------------------------------------
# Requires SAM segmentation to identify foreground pixels.
foreground_cutout:
  enabled: false
  probability: 0.3          # [0.0, 1.0] — chance of applying per frame
  max_fraction: 0.4         # [0.0, 1.0] — max fraction of foreground pixels to zero out
                            #   0.1 = mild occlusion, 0.3 = moderate, 0.5+ = aggressive

# ---------------------------------------------------------------------------
# Background color shift (cheap alternative to full replacement)
# ---------------------------------------------------------------------------
# Shifts hue/saturation/brightness of background pixels in HSV space.
# Requires SAM segmentation to identify background pixels.
background_color_shift:
  enabled: false
  hue_range: [-0.15, 0.15]       # [-0.5, 0.5] — hue rotation range (fraction of color wheel)
                                  #   0.0 = no shift, ±0.1 = subtle, ±0.5 = full rotation
  saturation_range: [0.7, 1.3]   # [>0] — saturation multiplier range
                                  #   1.0 = no change, <1 = desaturate, >1 = more vivid
  value_range: [0.7, 1.3]        # [>0] — brightness multiplier range
                                  #   1.0 = no change, <1 = darken, >1 = brighten

# ---------------------------------------------------------------------------
# Noise injection (sensor noise simulation)
# ---------------------------------------------------------------------------
noise_injection:
  enabled: false
  probability: 0.5          # [0.0, 1.0] — chance of applying per frame
  type: gaussian             # "gaussian" | "salt_pepper"
  gaussian:
    std: 0.02               # [>0] — standard deviation of additive noise
                            #   0.01 = barely visible, 0.02 = subtle grain,
                            #   0.05 = noticeable, 0.1+ = heavy
  salt_pepper:
    amount: 0.01            # [0.0, 1.0] — fraction of pixels affected
                            #   0.01 = sparse specks, 0.05 = moderate, 0.1+ = heavy
